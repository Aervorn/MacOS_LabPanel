# Projet XcodeGen : `xcodegen generate` crée LabPanel.xcodeproj
name: LabPanel
options:
  bundleIdPrefix: io.github.aervorn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    # Catalogue de chaînes : Xcode y ajoute les nouveaux textes de l'interface à chaque build
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  LabPanel:
    type: application
    platform: macOS
    sources:
      - path: LabPanel
    dependencies:
      - package: Sparkle
      - sdk: WebKit.framework
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: LabPanel
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Accès au réseau local (macOS 15+ le demande à la première connexion) ; texte traduit dans InfoPlist.xcstrings
        NSLocalNetworkUsageDescription: "LabPanel affiche les interfaces web des services de ton réseau local."
        # Les interfaces d'un homelab sont souvent en HTTP, sur une IP ou un nom de domaine local :
        # les pages web et les vérifications de disponibilité doivent pouvoir les joindre.
        # (Seule cette clé : ajouter NSAllowsLocalNetworking ou NSAllowsArbitraryLoadsInWebContent
        # ferait ignorer NSAllowsArbitraryLoads par macOS.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Sparkle : appcast.xml à la racine du dépôt, réécrit par scripts/make-dmg.sh
        SUFeedURL: https://raw.githubusercontent.com/Aervorn/MacOS_LabPanel/main/appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aervorn.labpanel
        PRODUCT_NAME: LabPanel
        # Clé publique EdDSA de Sparkle, la même que Flux et Vestora (la clé privée reste dans le trousseau)
        SPARKLE_PUBLIC_ED_KEY: "eZCHe74IeZ8DBTAY+tVftTLA2+kKJT3xD5e/QmhV2sE="
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signature locale ("Sign to Run Locally") : pas besoin de compte développeur
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - LabPanelTests

  # Tests sans app hôte : ils compilent directement le dossier Core (Foundation seulement).
  LabPanelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LabPanelTests
      - path: LabPanel/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aervorn.labpanel.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
